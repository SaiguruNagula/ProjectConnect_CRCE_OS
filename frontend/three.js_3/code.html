<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_16 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_16" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_16');
  const devicePixelRatio = window.devicePixelRatio || 1;
  "use client";
import React, { useRef, useEffect } from 'react';
import * as THREE from 'three';

export const WovenCanvas = () => {
  const mountRef = useRef(null);
  
  useEffect(() => {
    if (!mountRef.current) return;
    
    const scene = new THREE.Scene();
    const width = mountRef.current.clientWidth || window.innerWidth;
    const height = mountRef.current.clientHeight || window.innerHeight;
    
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.z = 5;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    mountRef.current.appendChild(renderer.domElement);
    
    const mouse = new THREE.Vector2(0, 0);
    const clock = new THREE.Clock();
    
    // Check for dark mode via class on body or html
    const isDarkMode = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark');
    
    // --- Woven Silk Particles ---
    const particleCount = 20000; // Optimized for mobile/web
    const positions = new Float32Array(particleCount * 3);
    const originalPositions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount * 3);
    
    const geometry = new THREE.BufferGeometry();
    const torusKnot = new THREE.TorusKnotGeometry(1.5, 0.4, 150, 20);
    
    const knotPositions = torusKnot.attributes.position;
    const knotCount = knotPositions.count;

    for (let i = 0; i < particleCount; i++) {
        const vertexIndex = i % knotCount;
        const x = knotPositions.getX(vertexIndex) + (Math.random() - 0.5) * 0.1;
        const y = knotPositions.getY(vertexIndex) + (Math.random() - 0.5) * 0.1;
        const z = knotPositions.getZ(vertexIndex) + (Math.random() - 0.5) * 0.1;
        
        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
        originalPositions[i * 3] = x;
        originalPositions[i * 3 + 1] = y;
        originalPositions[i * 3 + 2] = z;
        
        const color = new THREE.Color();
        // Brand-aligned colors: Indigo/Violet/Slate
        const h = 0.6 + Math.random() * 0.1; 
        const s = 0.7;
        const l = isDarkMode ? 0.6 : 0.4;
        color.setHSL(h, s, l);
        
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
        
        velocities[i * 3] = 0;
        velocities[i * 3 + 1] = 0;
        velocities[i * 3 + 2] = 0;
    }
    
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const material = new THREE.PointsMaterial({
        size: 0.015,
        vertexColors: true,
        blending: isDarkMode ? THREE.AdditiveBlending : THREE.NormalBlending,
        transparent: true,
        opacity: 0.8,
    });
    
    const points = new THREE.Points(geometry, material);
    scene.add(points);
    
    const handleMouseMove = (event) => {
        const rect = mountRef.current.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    };
    
    window.addEventListener('mousemove', handleMouseMove);
    
    let animationId;
    const animate = () => {
        animationId = requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();
        
        const mouseWorld = new THREE.Vector3(mouse.x * 4, mouse.y * 4, 0);
        const posAttr = geometry.attributes.position;
        
        for (let i = 0; i < particleCount; i++) {
            const ix = i * 3;
            const iy = i * 3 + 1;
            const iz = i * 3 + 2;
            
            const curX = positions[ix];
            const curY = positions[iy];
            const curZ = positions[iz];
            
            const dx = curX - mouseWorld.x;
            const dy = curY - mouseWorld.y;
            const dz = curZ - mouseWorld.z;
            const distSq = dx*dx + dy*dy + dz*dz;
            
            if (distSq < 2.25) { // 1.5 distance
                const dist = Math.sqrt(distSq);
                const force = (1.5 - dist) * 0.02;
                velocities[ix] += (dx / dist) * force;
                velocities[iy] += (dy / dist) * force;
                velocities[iz] += (dz / dist) * force;
            }
            
            // Return force
            velocities[ix] += (originalPositions[ix] - curX) * 0.01;
            velocities[iy] += (originalPositions[iy] - curY) * 0.01;
            velocities[iz] += (originalPositions[iz] - curZ) * 0.01;
            
            // Damping
            velocities[ix] *= 0.92;
            velocities[iy] *= 0.92;
            velocities[iz] *= 0.92;
            
            positions[ix] += velocities[ix];
            positions[iy] += velocities[iy];
            positions[iz] += velocities[iz];
        }
        
        posAttr.needsUpdate = true;
        points.rotation.y = elapsedTime * 0.1;
        points.rotation.z = elapsedTime * 0.05;
        
        renderer.render(scene, camera);
    };
    
    animate();
    
    const handleResize = () => {
        if (!mountRef.current) return;
        const w = mountRef.current.clientWidth;
        const h = mountRef.current.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    };
    
    window.addEventListener('resize', handleResize);
    
    return () => {
        window.removeEventListener('resize', handleResize);
        window.removeEventListener('mousemove', handleMouseMove);
        cancelAnimationFrame(animationId);
        if (mountRef.current && renderer.domElement) {
            mountRef.current.removeChild(renderer.domElement);
        }
        geometry.dispose();
        material.dispose();
        torusKnot.dispose();
    };
  }, []);
  
  return <div ref={mountRef} className="absolute inset-0 z-0" />;
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_16 -->
</body>
</html>
