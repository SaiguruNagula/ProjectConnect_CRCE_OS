<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">emoji_events</span>

<span class="material-symbols-outlined">record_voice_over</span>

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant opacity-60" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>

<script>
        const studentData = [
            { rank: 1, name: "Aarav Sharma", dept: "Computer Eng", score: 2450, credits: 120, projects: 12, solutions: 45, badge: "Gold Innovator", type: "student", avatar: "image-1" },
            { rank: 2, name: "Isha Malhotra", dept: "IT", score: 2320, credits: 115, projects: 9, solutions: 38, badge: "Builder", type: "student", avatar: "image-2" },
            { rank: 3, name: "Rohan Das", dept: "Electronics", score: 2180, credits: 110, projects: 11, solutions: 32, badge: "Problem Solver", type: "student", avatar: "image-3" },
            { rank: 4, name: "Sanya Gupta", dept: "Computer Eng", score: 1950, credits: 95, projects: 7, solutions: 28, badge: "Builder", type: "student", avatar: "image-4" },
            { rank: 5, name: "Vikram Singh", dept: "Mechanical", score: 1840, credits: 88, projects: 5, solutions: 21, badge: "Technician", type: "student", avatar: "image-5" }
        ];

        const facultyData = [
            { rank: 1, name: "Dr. Elena Gilbert", dept: "Computer Eng", score: 890, reviews: 142, mentored: 45, live: 12, badge: "Innovation Champion", type: "faculty", avatar: "image-6" },
            { rank: 2, name: "Prof. Alaric Saltzman", dept: "IT", score: 855, reviews: 118, mentored: 38, live: 8, badge: "Mentor", type: "faculty", avatar: "image-7" },
            { rank: 3, name: "Dr. Bonnie Bennett", dept: "Computer Eng", score: 820, reviews: 95, mentored: 32, live: 10, badge: "Reviewer", type: "faculty", avatar: "image-8" },
            { rank: 4, name: "Prof. Damon Salvatore", dept: "Mechanical", score: 790, reviews: 88, mentored: 25, live: 5, badge: "Mentor", type: "faculty", avatar: "image-9" },
            { rank: 5, name: "Dr. Caroline Forbes", dept: "Electronics", score: 760, reviews: 72, mentored: 22, live: 4, badge: "Reviewer", type: "faculty", avatar: "image-10" }
        ];

        let currentView = 'student';
        let searchQuery = '';

        const toggleStudent = document.getElementById('toggle-student');
        const toggleFaculty = document.getElementById('toggle-faculty');
        const searchInput = document.getElementById('ranking-search');
        const podiumContainer = document.getElementById('podium-container');
        const listBody = document.getElementById('ranking-list-body');
        const tableHeadRow = document.getElementById('table-head-row');

        const imageAlts = {
            "image-1": "A highly detailed portrait of a South Asian male student with glasses, smiling confidently. He is wearing a professional navy blue hoodie. Background is a blurred modern university hallway with soft indigo lighting. Photorealistic style, clean lines, premium UI aesthetic.",
            "image-2": "A portrait of a young female student with long dark hair, looking thoughtful and professional. She is in a brightly lit modern tech lab with subtle bokeh circles. Elegant and academic atmosphere, cinematic lighting, 8k resolution, minimalist tech vibe.",
            "image-3": "Close-up headshot of a male student with short hair, wearing a white smart-casual shirt. The lighting is warm and directional, creating a sophisticated look. Background is a soft-focus library with shelves of books. Clean, high-end commercial photography style.",
            "image-4": "A professional portrait of a young woman with a sharp gaze, wearing a modern gray blazer. Background is a clean, minimalist architectural space with glass and steel elements. High-key lighting, corporate minimalist aesthetic, sharp focus.",
            "image-5": "A portrait of a male student in a workshop setting, wearing a black tech shirt. Industrial but clean background with soft blue secondary lighting. High-contrast, professional engineering student profile, photorealistic.",
            "image-6": "A dignified portrait of a senior female professor with grey-streaked hair, smiling warmly. She is wearing a professional charcoal suit. Background is a bright, modern academic office with minimalist art. Authoritative and kind aesthetic, 8k, soft shadows.",
            "image-7": "Portrait of a middle-aged male professor with a beard, wearing a tweed jacket. He looks intellectual and approachable. The background is a blurred university courtyard with morning light. Rich textures, professional scholarly aesthetic.",
            "image-8": "A professional headshot of a female faculty member with a sharp, intelligent look. She is wearing glasses and a purple silk blouse. Background is a clean, modern lab. Sophisticated lighting, premium corporate academic style.",
            "image-9": "Close-up of a charismatic male faculty member in a dark blue shirt. He is standing in a high-tech modern lecture hall with glowing digital screens in the background. High-end, tech-focused professional photography.",
            "image-10": "A professional portrait of a young female lecturer with blonde hair, wearing a white blazer. Background is a soft, airy minimalist lobby. Fresh, clean, modern academic look with subtle high-key lighting."
        };

        function renderPodium(data) {
            const top3 = data.slice(0, 3);
            podiumContainer.innerHTML = '';
            
            // Render 2nd, 1st, 3rd for visual podium layout
            const visualOrder = [top3[1], top3[0], top3[2]];
            
            visualOrder.forEach((item, index) => {
                const isWinner = item.rank === 1;
                const card = document.createElement('div');
                card.className = `relative flex flex-col items-center p-lg rounded-2xl border border-outline-variant bg-surface transition-all duration-300 hover:shadow-md ${isWinner ? 'md:-translate-y-4 border-secondary/30 bg-white ring-1 ring-secondary/5' : ''}`;
                
                card.innerHTML = `
                    <div class="relative mb-md">
                        <div class="w-24 h-24 rounded-full border-4 ${isWinner ? 'border-secondary' : 'border-outline-variant'} overflow-hidden">
                            <img src="placeholder" data-alt="${imageAlts[item.avatar]}" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 px-sm py-1 bg-secondary text-on-primary rounded-full text-label-md font-bold">
                            #${item.rank}
                        </div>
                    </div>
                    <h3 class="font-headline-sm text-headline-sm font-bold text-primary mb-xs">${item.name}</h3>
                    <p class="text-label-md font-label-md text-on-surface-variant mb-md">${item.dept}</p>
                    <div class="flex items-center gap-xs mb-sm">
                        <span class="material-symbols-outlined text-secondary scale-90">verified</span>
                        <span class="font-body-md text-body-md font-bold text-secondary">${item.score} <span class="text-on-surface-variant font-normal">pts</span></span>
                    </div>
                    <span class="px-md py-1 bg-surface-container-high rounded-full text-label-md font-medium text-on-surface-variant">
                        ${item.badge}
                    </span>
                `;
                podiumContainer.appendChild(card);
            });
        }

        function renderList(data) {
            listBody.innerHTML = '';
            
            // Headers
            if (currentView === 'student') {
                tableHeadRow.innerHTML = `
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Rank</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Entity</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Department</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-right">Score</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-right">Projects</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-center">Badge</th>
                    <th class="px-lg py-md"></th>
                `;
            } else {
                tableHeadRow.innerHTML = `
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Rank</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Faculty</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">Department</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-right">F-Score</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-right">Mentored</th>
                    <th class="px-lg py-md text-label-md font-label-md text-on-surface-variant uppercase tracking-wider text-center">Designation</th>
                    <th class="px-lg py-md"></th>
                `;
            }

            const filteredData = data.filter(item => 
                item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.dept.toLowerCase().includes(searchQuery.toLowerCase())
            );

            filteredData.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-surface-container-low transition-colors group";
                
                const mainMetric = currentView === 'student' ? item.projects : item.mentored;
                const scoreLabel = currentView === 'student' ? item.score : item.score;
                
                row.innerHTML = `
                    <td class="px-lg py-md font-mono text-body-md text-on-surface-variant">#${item.rank.toString().padStart(2, '0')}</td>
                    <td class="px-lg py-md">
                        <div class="flex items-center gap-sm">
                            <div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden flex-shrink-0">
                                <img src="placeholder" data-alt="${imageAlts[item.avatar]}" class="w-full h-full object-cover">
                            </div>
                            <span class="font-body-md text-body-md font-semibold text-primary">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-lg py-md font-body-md text-body-md text-on-surface-variant">${item.dept}</td>
                    <td class="px-lg py-md text-right font-mono text-body-md font-bold text-secondary">${scoreLabel}</td>
                    <td class="px-lg py-md text-right font-mono text-body-md text-on-surface-variant">${mainMetric}</td>
                    <td class="px-lg py-md text-center">
                        <span class="px-sm py-1 bg-emerald-50 text-emerald-700 rounded-full text-label-md font-medium whitespace-nowrap">
                            ${item.badge}
                        </span>
                    </td>
                    <td class="px-lg py-md text-right">
                        <button class="opacity-0 group-hover:opacity-100 px-md py-1 border border-outline-variant rounded-lg text-label-md font-bold text-on-surface hover:bg-surface transition-all">View Profile</button>
                    </td>
                `;
                listBody.appendChild(row);
            });
        }

        function updateView(view) {
            currentView = view;
            if (view === 'student') {
                toggleStudent.className = "flex-1 md:flex-none px-xl py-xs rounded-lg font-label-md text-label-md transition-all bg-surface-container-highest text-primary shadow-sm";
                toggleFaculty.className = "flex-1 md:flex-none px-xl py-xs rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container";
                renderPodium(studentData);
                renderList(studentData);
            } else {
                toggleFaculty.className = "flex-1 md:flex-none px-xl py-xs rounded-lg font-label-md text-label-md transition-all bg-surface-container-highest text-primary shadow-sm";
                toggleStudent.className = "flex-1 md:flex-none px-xl py-xs rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:bg-surface-container";
                renderPodium(facultyData);
                renderList(facultyData);
            }
        }

        toggleStudent.addEventListener('click', () => updateView('student'));
        toggleFaculty.addEventListener('click', () => updateView('faculty'));

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderList(currentView === 'student' ? studentData : facultyData);
        });

        // Initial Load
        updateView('student');
    </script>
</body></html>
